name: Deploy to VM with Docker

on:
  push:
    branches:
      - main
      - dev
      - feature/frontend-wikigroup

jobs:
  deploy:
    # Usar self-hosted runner configurado en el servidor
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verificar prerrequisitos
        run: |
          echo "🔍 Verificando Docker y Docker Compose..."
          docker --version
          docker compose version
          echo "✅ Prerrequisitos OK"

      - name: Build & Restart Docker container
        run: |
          echo "🚀 Iniciando deploy del frontend..."
          
          # Detener contenedores existentes
          docker compose down || true
          
          # Limpiar imágenes antiguas (opcional)
          docker image prune -f || true
          
          # Construir y levantar el contenedor
          docker compose up -d --build
          
          echo "✅ Deploy completado exitosamente"
          
      - name: Verificar estado del contenedor
        run: |
          echo "📊 Estado de los contenedores:"
          docker compose ps
          
          echo "📋 Logs recientes:"
          docker compose logs --tail=50
