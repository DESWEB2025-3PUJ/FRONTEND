<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/home" class="brand-logo">
        <span class="brand-icon">📊</span>
        <span class="brand-text">WikiGroup</span>
      </a>
    </div>

    <button class="navbar-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="navbar-menu" [class.active]="isMenuOpen">
      @if (currentUser$ | async; as user) {
        <!-- Usuario autenticado -->
        <a routerLink="/home" routerLinkActive="active" class="nav-link">
          Inicio
        </a>
        
        <a routerLink="/procesos" routerLinkActive="active" class="nav-link">
          Procesos
        </a>

        @if (authService.canEdit()) {
          <a routerLink="/roles" routerLinkActive="active" class="nav-link">
            Roles
          </a>
        }

        @if (authService.isAdmin()) {
          <a routerLink="/empresas" routerLinkActive="active" class="nav-link">
            Empresas
          </a>
        }

        <div class="navbar-user">
          <span class="user-name">{{ user.nombre }}</span>
          <span class="user-role">{{ user.rol }}</span>
          <button class="btn-logout" (click)="logout()">
            Cerrar Sesión
          </button>
        </div>
      } @else {
        <!-- Usuario no autenticado -->
        <a routerLink="/home" routerLinkActive="active" class="nav-link">
          Inicio
        </a>
        
        <a routerLink="/login" routerLinkActive="active" class="nav-link">
          Iniciar Sesión
        </a>
        
        <a routerLink="/register" routerLinkActive="active" class="nav-link btn-register">
          Registrarse
        </a>
      }
    </div>
  </div>
</nav>
