<div class="text-center py-4">
  <div 
    class="spinner-border text-primary" 
    [class.spinner-border-sm]="size() === 'sm'"
    [class.spinner-border-lg]="size() === 'lg'"
    role="status">
    <span class="visually-hidden">{{ message() }}</span>
  </div>
  <p class="text-muted mt-2 mb-0">{{ message() }}</p>
</div>
